<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>প্ৰজ্ঞানম - Pragyanam</title>
    
    <!-- Google Fonts: অসমীয়া ফন্ট Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- Top App Bar -->
        <header class="top-nav">
            <button class="nav-icon-btn" id="btn-hamburger"><i class="fa-solid fa-bars"></i></button>
            <div class="top-nav-right">
                <div class="notif-wrapper" id="btn-top-notif">
                    <i class="fa-solid fa-bell"></i>
                    <span class="badge">০</span>
                </div>
                <div class="profile-avatar" id="btn-top-profile">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </header>

        <!-- Dynamic Main Content Area -->
        <main class="main-container" id="main-view">
            <!-- Home content will be rendered here dynamically -->
        </main>

        <!-- Persistent Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="#home" class="nav-item active" data-tab="home">
                <i class="fa-solid fa-house"></i>
                <span>হোম</span>
            </a>
            <a href="#notes" class="nav-item" data-tab="notes">
                <i class="fa-solid fa-book"></i>
                <span>নোটছ</span>
            </a>
            <a href="#videos" class="nav-item" data-tab="videos">
                <i class="fa-solid fa-circle-play"></i>
                <span>ভিডিঅ’ছ</span>
            </a>
            <a href="#updates" class="nav-item" data-tab="updates">
                <div class="nav-icon-dot">
                    <i class="fa-solid fa-bell"></i>
                    <span class="dot"></span>
                </div>
                <span>ঘোষণা</span>
            </a>
            <a href="#tests" class="nav-item" data-tab="tests">
                <i class="fa-solid fa-list-check"></i>
                <span>পৰীক্ষা</span>
            </a>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
